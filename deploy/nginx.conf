# ═══════════════════════════════════════════════════════════════
# EcoTwin Nginx Reverse Proxy Configuration
# Supports custom domain with SSL termination, HTTP/2, HSTS,
# static frontend serving, and FastAPI backend proxying.
# ═══════════════════════════════════════════════════════════════

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ecotwin.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ecotwin.yourdomain.com;

    # SSL Certificates (e.g. Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/ecotwin.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecotwin.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://generativelanguage.googleapis.com; frame-ancestors 'none';" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Root frontend build directory
    root /var/www/ecotwin/frontend/dist;
    index index.html;

    # Client body size limit (matching 5MB image upload cap)
    client_max_body_size 10M;

    # API Proxy to FastAPI Backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Static Assets caching
    location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Single Page App routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
