[project]
name = "ecotwin-backend"
version = "0.1.0"
description = "EcoTwin: Smart Waste Management Digital Twin backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "ultralytics>=8.0.0",
    "httpx>=0.25.0",
    "reportlab>=4.0.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
