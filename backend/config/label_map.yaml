# Waste class label mapping
# Maps raw YOLO detection labels to EcoTwin's four canonical waste classes.
# Each entry: raw_label -> { class, description }
# If a detected label is not in this map, it is classified as "dry" by default.

label_map:
  banana:
    class: wet
    description: Organic fruit waste
  apple:
    class: wet
    description: Organic fruit waste
